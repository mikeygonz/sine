<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <title>Sine</title>
    <meta name="description" content="Draw a shape. Hear its Fourier series." />
    <link rel="icon" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Share previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sine" />
    <meta property="og:title" content="Sine" />
    <meta property="og:description" content="Draw a shape. Hear its Fourier series." />
    <meta property="og:url" content="https://sine.gonz.co/" />
    <meta property="og:image" content="https://sine.gonz.co/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The word sine written by spinning circles, with its wave below."
    />
    <meta property="og:video" content="https://sine.gonz.co/og.mp4" />
    <meta property="og:video:secure_url" content="https://sine.gonz.co/og.mp4" />
    <meta property="og:video:type" content="video/mp4" />
    <meta property="og:video:width" content="1200" />
    <meta property="og:video:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sine" />
    <meta name="twitter:description" content="Draw a shape. Hear its Fourier series." />
    <meta name="twitter:image" content="https://sine.gonz.co/og.png?v=2" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="c" aria-label="Drawing area. Draw a shape and it is rebuilt from sine waves."></canvas>
    <header>
      <h1>Sine</h1>
      <p>Draw a shape. Hear its Fourier series.</p>
    </header>
    <a
      class="gh"
      href="https://github.com/mikeygonz/sine"
      aria-label="Source on GitHub"
      title="Source on GitHub"
    >
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
        />
      </svg>
    </a>
    <div class="bar" role="toolbar" aria-label="Controls">
      <form class="ask" id="ask" autocomplete="off" hidden>
        <input
          id="q"
          name="q"
          type="text"
          maxlength="60"
          enterkeyhint="go"
          placeholder="Type something for AI to draw"
          aria-label="Type something for AI to draw"
        />
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <button class="go" id="go" type="submit" aria-label="Draw" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </form>
      <div class="row">
        <div class="strip" id="strip">
          <div class="seg" id="seg" role="group" aria-label="Shapes">
            <button type="button" data-s="star" aria-pressed="true">Star</button>
            <button type="button" data-s="heart" aria-pressed="false">Heart</button>
            <button type="button" data-s="square" aria-pressed="false">Square</button>
            <button type="button" data-s="giraffe" aria-pressed="false">Giraffe</button>
            <button type="button" class="keep" id="keep" hidden>Save</button>
            <span id="list" class="mine"></span>
          </div>
        </div>
        <button type="button" class="snd" id="snd" aria-pressed="false" aria-label="Sound">
          <svg
            class="off"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4z" />
            <path d="m22 9-6 6M16 9l6 6" />
          </svg>
          <svg
            class="on"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
          </svg>
        </button>
        <button
          type="button"
          class="snd tune"
          id="tune"
          aria-expanded="false"
          aria-controls="tuner"
          aria-label="Tune the sound"
          title="Tune the sound"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" />
            <circle cx="15" cy="6" r="2" />
            <circle cx="9" cy="12" r="2" />
            <circle cx="17" cy="18" r="2" />
          </svg>
        </button>
        <div class="waves">
          <input id="n" type="range" min="0" max="19" step="1" value="4" aria-label="Waves" />
          <span class="out" id="out" aria-hidden="true"></span>
        </div>
      </div>
      <div class="hint" id="hint" hidden><span id="hint-t" role="status" aria-live="polite"></span><button type="button" class="hint-x" id="hint-x" aria-label="Dismiss"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button></div>
      <div class="pop tuner" id="tuner" role="group" aria-label="Sound">
        <label
          ><span class="k">Volume</span><input type="range" data-k="volume" min="0" max="100" /><span
            class="v"
          ></span
        ></label>
        <div class="t">
          <span class="k">Scale</span>
          <div class="opts" role="group" aria-label="Scale">
            <button type="button" data-scale="free">Free</button
            ><button type="button" data-scale="penta">Penta</button
            ><button type="button" data-scale="major">Major</button
            ><button type="button" data-scale="minor">Minor</button>
          </div>
        </div>
        <div class="t">
          <span class="k">Notes</span>
          <div class="opts" role="group" aria-label="Notes">
            <button type="button" data-notes="pluck">Pluck</button
            ><button type="button" data-notes="hold">Hold</button>
          </div>
        </div>
        <label class="more"
          ><span class="k">Pitch</span><input type="range" data-k="root" min="-12" max="12" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Range</span><input type="range" data-k="range" min="1" max="8" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Glide</span><input type="range" data-k="glide" min="0" max="600" step="10" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Overtones</span><input type="range" data-k="overtones" min="1" max="64" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Warmth</span><input type="range" data-k="warmth" min="0" max="100" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Room</span><input type="range" data-k="room" min="0" max="100" /><span
            class="v"
          ></span
        ></label>
        <div class="foot">
          <button type="button" class="reset more">Reset</button
          ><button type="button" class="expand" aria-expanded="false">More</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
