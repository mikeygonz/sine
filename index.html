<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <title>Sine</title>
    <meta name="description" content="Draw a shape and watch spinning circles redraw it." />
    <link rel="icon" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Share previews. Base URL is the preview; switch to the real domain when Sine goes public. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sine" />
    <meta property="og:title" content="Sine" />
    <meta property="og:description" content="Any shape is spinning circles. Draw one." />
    <meta property="og:url" content="https://sine-preview.vercel.app/" />
    <meta property="og:image" content="https://sine-preview.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A star traced by spinning circles, next to the words: Any shape is spinning circles. Draw one."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sine" />
    <meta name="twitter:description" content="Any shape is spinning circles. Draw one." />
    <meta name="twitter:image" content="https://sine-preview.vercel.app/og.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="c" aria-label="Drawing area. Draw a shape and it is rebuilt from sine waves."></canvas>
    <header>
      <h1>Sine</h1>
      <p>Any shape is spinning circles. Draw one.</p>
    </header>
    <div class="bar" role="toolbar" aria-label="Controls">
      <form class="ask" id="ask" autocomplete="off" hidden>
        <input
          id="q"
          name="q"
          type="text"
          maxlength="60"
          enterkeyhint="go"
          placeholder="Draw anything"
          aria-label="Draw anything"
        />
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <button class="go" id="go" type="submit" aria-label="Draw" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </form>
      <div class="row">
        <div class="seg" role="group" aria-label="Shape">
          <button type="button" data-s="star" aria-pressed="true">Star</button>
          <button type="button" data-s="heart" aria-pressed="false">Heart</button>
          <button type="button" data-s="square" aria-pressed="false">Square</button>
          <button type="button" id="saved" aria-expanded="false" aria-controls="shelf">Saved</button>
        </div>
        <div class="pop shelf" id="shelf" role="group" aria-label="Saved shapes">
          <form class="keep" id="keep" autocomplete="off" hidden>
            <input id="name" type="text" maxlength="40" enterkeyhint="done" aria-label="Name" />
            <button type="submit" class="save">Save</button>
          </form>
          <p class="none" id="none" hidden>Draw a shape to save it here.</p>
          <ul class="list" id="list"></ul>
        </div>
        <button type="button" class="snd" id="snd" aria-pressed="false" aria-label="Sound">
          <svg
            class="off"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4z" />
            <path d="m22 9-6 6M16 9l6 6" />
          </svg>
          <svg
            class="on"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M11 5 6 9H3v6h3l5 4z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" />
          </svg>
        </button>
        <input id="vol" class="vol" type="range" min="0" max="100" aria-label="Volume" disabled />
        <button
          type="button"
          class="snd tune"
          id="tune"
          aria-expanded="false"
          aria-controls="tuner"
          aria-label="Tune the sound"
          title="Tune the sound"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" />
            <circle cx="15" cy="6" r="2" />
            <circle cx="9" cy="12" r="2" />
            <circle cx="17" cy="18" r="2" />
          </svg>
        </button>
        <div class="waves">
          <input id="n" type="range" min="0" max="19" step="1" value="4" aria-label="Waves" />
          <span class="out" id="out" aria-hidden="true"></span>
        </div>
      </div>
      <div class="pop tuner" id="tuner" role="group" aria-label="Sound">
        <div class="t">
          <span class="k">Scale</span>
          <div class="opts" role="group" aria-label="Scale">
            <button type="button" data-scale="free">Free</button
            ><button type="button" data-scale="penta">Penta</button
            ><button type="button" data-scale="major">Major</button
            ><button type="button" data-scale="minor">Minor</button>
          </div>
        </div>
        <div class="t">
          <span class="k">Notes</span>
          <div class="opts" role="group" aria-label="Notes">
            <button type="button" data-notes="pluck">Pluck</button
            ><button type="button" data-notes="hold">Hold</button>
          </div>
        </div>
        <label class="more"
          ><span class="k">Pitch</span><input type="range" data-k="root" min="-12" max="12" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Range</span><input type="range" data-k="range" min="1" max="8" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Glide</span><input type="range" data-k="glide" min="0" max="600" step="10" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Overtones</span><input type="range" data-k="overtones" min="1" max="64" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Warmth</span><input type="range" data-k="warmth" min="0" max="100" /><span
            class="v"
          ></span
        ></label>
        <label class="more"
          ><span class="k">Room</span><input type="range" data-k="room" min="0" max="100" /><span
            class="v"
          ></span
        ></label>
        <div class="foot">
          <button type="button" class="reset more">Reset</button
          ><button type="button" class="expand" aria-expanded="false">More</button>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
